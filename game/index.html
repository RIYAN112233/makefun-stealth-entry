<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightglass — a quiet museum heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage {
    position: relative;
    width: 960px;
    height: 600px;
  }
  canvas {
    display: block;
    width: 960px;
    height: 600px;
    background: #0b101c;
    border: 1px solid #1d2b45;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(20, 60, 120, 0.25), 0 0 120px rgba(0, 0, 0, 0.8);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
